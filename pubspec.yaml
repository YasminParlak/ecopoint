name: ecopoint
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  geolocator: ^10.1.0
  supabase_flutter: ^2.8.0  # Совместимая версия для Dart 3.6
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.0 # Совместимая версия для Dart 3.6
  http: ^1.2.0               # Совместимая версия для Dart 3.6
  yandex_mapkit: 4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0      # ✅ ИСПРАВЛЕНО: Версия 4.x поддерживает Dart 3.5-3.6

flutter:
  uses-material-design: true

  assets:
    - assets/icons/marker_green.png
    - assets/icons/marker_red.png   
    - assets/icons/user_marker.png 